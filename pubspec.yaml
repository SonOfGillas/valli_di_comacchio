name: valli_di_comacchio
description: 'A new Flutter project.'
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  flutter_dotenv: ^5.2.1
  flutter_native_splash: ^2.4.4
  get_it: ^8.0.3
  go_router: ^15.1.1
  google_fonts: ^6.2.1
  intl: any
  flutter_svg: ^2.1.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  firebase_core: ^3.13.0
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  dio: ^5.8.0+1
  dartz: ^0.10.1
  formz: ^0.8.0
  confetti: ^0.8.0
  flutter_launcher_icons: ^0.14.4
  firebase_auth: ^5.6.0

dev_dependencies:
  build_runner:
  flutter_gen_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/google_fonts/
    - .env
    # - lib/app/features/

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_it.arb
  output-localization-file: app_localizations.dart

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/images/playstore-icon.png'
  min_sdk_android: 23
